<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Cameras — Radio Web Criativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260924-1">
  <script src="/assets/hls.min.js" defer></script>
  <script src="app.js?v=20260917-2" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="18" cy="18" r="18" fill="url(#grad)"/>
            <circle cx="18" cy="18" r="6" fill="#fff"/>
            <path d="M18 6 A12 12 0 0 1 30 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
            <path d="M18 6 A12 12 0 0 0 6 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="36" y2="36">
                <stop offset="0%" stop-color="#4f8ef7"/>
                <stop offset="100%" stop-color="#7c5cfc"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <p class="eyebrow">cameras.radiowebcriativa.com.br</p>
          <h1>Painel de Cameras</h1>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status-pill" id="overallStatus">
          <span class="status-dot"></span>
          Carregando
        </div>
      </div>
    </header>

    <nav class="nav-menu" aria-label="Navegacao">
      <a href="#resumo">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity=".7"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".4"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".7"/></svg>
        Resumo
      </a>
      <a href="#novo-canal">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Adicionar canal
      </a>
      <a href="#canais">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="3" width="14" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="8" width="14" height="3" rx="1" fill="currentColor"/><rect x="1" y="13" width="9" height="2" rx="1" fill="currentColor" opacity=".4"/></svg>
        Canais
      </a>
      <a href="#player-area">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="2" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 5.5l4 2.5-4 2.5V5.5z" fill="currentColor"/><path d="M5 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Player
      </a>
      <a href="/" class="nav-external">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M7 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 2h5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2L8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Site publico
      </a>
    </nav>

    <section class="summary" id="resumo" aria-label="Resumo">
      <div class="stat-card">
        <div class="stat-icon cert-icon">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2l2.09 4.26L17 7.27l-3.5 3.41.83 4.82L10 13.27l-4.33 2.23.83-4.82L3 7.27l4.91-.71L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <span>Certificado SSL</span>
          <strong id="certDate">—</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon container-icon">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 9h16" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="7" r="1" fill="currentColor"/><circle cx="9" cy="7" r="1" fill="currentColor"/></svg>
        </div>
        <div>
          <span>Containers</span>
          <strong id="containersState">—</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon update-icon">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <span>Atualizado em</span>
          <strong id="updatedAt">—</strong>
        </div>
      </div>
    </section>

    <section class="add-channel" id="novo-canal" aria-label="Adicionar canal">
      <div class="section-title">
        <div class="section-title-left">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v6M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <h2>Adicionar canal</h2>
        </div>
        <span id="formStatus" class="form-status-text">Pronto</span>
      </div>
      <form id="channelForm">
        <label>
          Nome do canal
          <input name="name" required placeholder="Ex: Centro">
        </label>
        <label>
          Caminho publico
          <input name="slug" required placeholder="Ex: centro">
        </label>
        <label class="wide">
          URL da fonte
          <input name="source_url" required placeholder="rtsp://usuario:senha@ip:554/... ou https://.../playlist.m3u8">
        </label>
        <label>
          Modo de processamento
          <select name="mode">
            <option value="copy">Remux / Copy (mais rapido)</option>
            <option value="transcode">Transcodificar H.265/outros</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="button" id="probeButton" class="btn-secondary">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Testar fonte
          </button>
          <button type="submit" class="btn-primary">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Criar canal
          </button>
        </div>
      </form>
    </section>

    <section class="content">
      <div class="channels-col">
        <div class="section-header">
          <div class="section-title-left">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 8.5l4 2.5-4 2.5V8.5z" fill="currentColor"/></svg>
            <h2 id="canais">Canais</h2>
          </div>
        </div>
        <div id="channels" class="channels-list"></div>
      </div>
      <aside class="viewer" id="player-area">
        <div class="viewer-header">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="2" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 6.5l4 2.5-4 2.5V6.5z" fill="currentColor"/></svg>
          <span>Player ao vivo</span>
        </div>
        <div class="video-wrap">
          <video id="player" controls muted playsinline></video>
        </div>
        <div class="viewer-meta">
          <strong id="viewerTitle">Selecione um canal</strong>
          <span id="viewerUrl">—</span>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
